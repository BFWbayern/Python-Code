<form hx-post="{{ url_for('update_video', video_id=video.id) }}" hx-target="closest .modal" hx-swap="outerHTML">

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input name="title" class="form-control" value="{{ video.title }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control">{{ video.description }}</textarea>
    </div>

    <button class="btn btn-primary">Save</button>
</form>
