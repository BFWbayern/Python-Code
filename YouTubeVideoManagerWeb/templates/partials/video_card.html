<div id="video-{{ video.id }}" class="col-12 col-md-6 col-lg-4">
    <div class="card h-100 shadow-sm video-card">
        <a href="{{ video.url }}" target="_blank" class="ratio ratio-16x9">
            <img src="{{ video.thumbnail }}" class="object-fit-cover w-100 h-100" alt="Thumbnail">
        </a>

        <div class="card-body">
            <h5 class="card-title text-truncate" title="{{ video.title }}">
                {{ video.title }}
            </h5>

            {% if video.description %}
            <p class="card-text small text-muted">
                {{ video.description }}
            </p>
            {% endif %}

            <div class="d-flex gap-2 mt-2">
                <button class="btn btn-sm btn-warning ms-auto" hx-get="{{ url_for('edit_video', video_id=video.id) }}"
                    hx-target="#modal-body" hx-trigger="click" data-bs-toggle="modal" data-bs-target="#editModal">
                    Edit
                </button>


                <button class="btn btn-sm btn-outline-danger" hx-post="{{ url_for('delete_video', video_id=video.id) }}"
                    hx-target="#video-{{ video.id }}" hx-swap="outerHTML">
                    Delete
                </button>

            </div>
        </div>

    </div>
</div>
